<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="/PracticheskieUchebka/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Зоомагазин — каталог животных и система учёта магазина.">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Зоомагазин">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Зоомагазин</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #121212;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #121212;
      color: #e8eaed;
      z-index: 9999;
    }
    #splash .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    #splash .pets {
      font-size: 30px;
      color: #81c784;
    }
    #splash .hint {
      font-size: 12px;
      color: #9aa0a6;
    }
    #splash .spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid #2c2c2c;
      border-top-color: #81c784;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo"><span class="pets">🐾</span> Зоомагазин</div>
    <div class="spinner"></div>
    <div class="hint">Загрузка приложения…</div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (items) {
        items.forEach(function (item) {
          item.unregister();
        });
      });
    }
    if (window.caches) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) {
          caches.delete(key);
        });
      });
    }
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
    setTimeout(function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    }, 15000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
